# Configuration for LLaVA-v1.5-7B with Cross-Layer Adapter
# 跨层适配器配置文件

# Model Configuration
model:
  # LLaVA base model
  llava_model_name: "liuhaotian/llava-v1.5-7b"  # HuggingFace model name
  freeze_base_model: true  # Freeze LLaVA parameters, only train adapter
  
  # Vision Encoder (CLIP ViT-L/14)
  vision:
    hidden_size: 1024
    num_layers: 24
    patch_size: 14
    image_size: 224
  
  # Language Model (Vicuna-7B)
  language:
    hidden_size: 4096
    num_layers: 32
    vocab_size: 32000
  
  # Cross-Layer Adapter
  adapter:
    hidden_size: 256  # Adapter internal dimension (for efficiency)
    num_attention_heads: 8
    n_tokens: 4  # Number of adapter tokens per layer
    cross_layer_point: 16  # Switch point: layers 1-16 (V→L), 17-32 (L→V)
    
    # Bidirectional Knowledge Flow:
    # - Layers 1-16: Vision → Language (visual grounding, prevent hallucination)
    # - Layers 17-32: Language → Vision (semantic enhancement)

# Training Configuration
training:
  # Basic settings
  batch_size: 4  # Adjust based on GPU memory
  num_epochs: 5
  gradient_accumulation_steps: 4  # Effective batch size = 4 * 4 = 16
  
  # Optimization
  optimizer: "adamw"
  learning_rate: 2.0e-4  # Higher LR for adapter parameters
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Mixed Precision Training
  use_amp: true  # Automatic Mixed Precision (fp16)
  
  # Loss Configuration
  hallucination_loss_weight: 0.1  # Weight for hallucination detection loss
  target_alignment_score: 0.8  # Target vision-language alignment
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3  # Keep only last 3 checkpoints
  output_dir: "./outputs/llava_adapter"
  
  # Logging
  logging_steps: 50
  report_alignment_scores: true  # Log per-layer alignment scores

# Data Configuration  
data:
  # Training data
  train_data_path: null  # Path to training JSON (COCO Captions format)
  # Example: "./data/coco/annotations/captions_train2017.json"
  train_image_dir: null  # Path to training images
  # Example: "./data/coco/train2017"
  
  # Validation data
  val_data_path: null  # Path to validation JSON
  val_image_dir: null  # Path to validation images
  
  # Data processing
  max_length: 512  # Maximum sequence length
  image_size: 224
  num_workers: 4
  
  # Data augmentation (for training)
  use_augmentation: true
  random_flip: true
  color_jitter: true

# Evaluation Configuration
evaluation:
  # CHAIR (Caption Hallucination Assessment with Image Relevance)
  chair:
    coco_instances_path: null  # Path to COCO instances annotations
    # Example: "./data/coco/annotations/instances_val2017.json"
    
  # POPE (Polling-based Object Probing Evaluation)
  pope:
    pope_data_path: null  # Path to POPE evaluation data
    # Example: "./data/pope/coco_pope_adversarial.json"
    
  # General evaluation settings
  eval_batch_size: 8
  num_beams: 1  # For generation
  max_new_tokens: 128
  
  # Metrics to compute
  compute_chair: true
  compute_pope: true
  compute_alignment_scores: true

# Hardware Configuration
hardware:
  device: "cuda"  # "cuda" or "cpu"
  num_gpus: 1
  distributed: false  # For multi-GPU training
  fp16: true  # Use fp16 precision

# Reproducibility
seed: 42

# Experiment Tracking
experiment:
  name: "llava_v1.5_7b_hicropl_adapter"
  notes: "Apply HiCroPL cross-layer adapter to LLaVA-v1.5-7B for hallucination mitigation"
  tags: ["llava", "hicropl", "hallucination", "cross-layer"]
